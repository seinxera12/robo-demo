[project]
name = "lightweight-voice-demo"
version = "0.1.0"
description = "Lightweight API-powered voice assistant demo"
requires-python = "==3.11.*"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "websockets==13.1",
    # Configuration
    "python-dotenv==1.0.1",
    "pydantic==2.10.3",
    # HTTP client
    "httpx==0.28.1",
    # LLM / STT APIs
    "groq==0.13.0",
    "google-generativeai==0.8.3",
    # TTS (local, CPU-only)
    "kokoro==0.9.4",
    "misaki[en,ja]==0.9.4",
    # PyTorch CPU-only
    "torch==2.5.1",
    "torchaudio==2.5.1",
    # Audio I/O
    "soundfile==0.12.1",
    "sounddevice==0.5.1",
    # Numeric / array utilities
    "numpy==1.26.4",
    # Web search (optional)
    "tavily-python==0.5.0",
    # Testing
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
